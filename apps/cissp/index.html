  body.innerHTML=quizHead(Q)+`<div class="q"><div class="cnav"><span class="tag">${Q.exam?esc(q.dom.tag)+" · "+esc(q.dom.short)+" · ":""}Question ${Q.i+1} / ${Q.qs.length}</span>
    <span class="pips">${Q.qs.map((x,i)=>`<i class="${x.pick==null?"":x.pick===x.ans?"g":"b"} ${i===Q.i?"c":""}"></i>`).join("")}</span></div>
    <p class="stem">${esc(q.stem)}</p>
    ${q.opts.map((o,i)=>`<button class="opt ${done&&i===q.ans?"right":""} ${done&&i===q.pick&&i!==q.ans?"wrong":""}" data-i="${i}" ${done?"disabled":""}><span class="l">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}
    ${done?`<div class="why"><b>${q.pick===q.ans?"Correct.":"Not quite."}</b> ${esc(q.why)}${q.ex?`<div class="ex">${esc(q.ex)}</div>`:""}</div>
      <div class="cnav">${AI?`<button class="btn ghost sm" id="explain" ${q.ex||q.exBusy?"disabled":""}>${q.exBusy?"Thinking…":q.ex?"Explained":"Explain it simpler"}</button>`:"<span></span>"}<button class="btn gold" id="next">${Q.i===Q.qs.length-1?"See score":"Next"}</button></div>`:""}</div>`;
  body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{q.pick=+b.dataset.i;logAnswer(q);renderQuiz()});
  if($("next"))$("next").onclick=()=>{Q.i++;renderQuiz()};
  if($("quitQ"))$("quitQ").onclick=()=>{quiz=null;rerender()};
  if($("explain"))$("explain").onclick=()=>explain(q);
}
function renderResult(Q,body){
  const right=Q.qs.filter(q=>q.pick===q.ans).length;const pct=right/Q.qs.length;
  if(!Q.recorded){Q.recorded=true;
    if(Q.kind==="domain"){const r=S.quiz[Q.ref]||{best:0,tries:0};r.tries++;r.best=Math.max(r.best,pct);S.quiz[Q.ref]=r}
    else if(Q.kind==="net"){const r=S.net[Q.ref]||{best:0,tries:0};r.tries++;r.best=Math.max(r.best,pct);S.net[Q.ref]=r}
    else if(Q.kind==="exam"){S.exam={last:pct,best:Math.max((S.exam||{}).best||0,pct),at:Date.now()}}
    save();header()}
  const miss=Q.qs.filter(q=>q.pick!==q.ans);
  body.innerHTML=quizHead(Q)+`<div class="result"><p class="eyebrow">${Q.exam?"Mixed exam":Q.ai?"AI drill":"Quiz"} result</p><b style="color:${pct>=.8?"var(--good)":pct>=.6?"var(--gold)":"var(--bad)"}">${Math.round(pct*100)}%</b>
    <p class="muted">${right} of ${Q.qs.length} right. ${pct>=.8?"That's passing territory.":pct>=.6?"Close. Review the misses below.":"Go back to the lesson and the cards first."}</p>
    ${miss.length?`<div class="missed"><p class="eyebrow" style="margin-top:8px">Review what you missed</p>${miss.map(q=>`<div><span class="tag">${esc(q.dom.tag)}</span> ${esc(q.stem)}<br><em>${esc(q.opts[q.ans])}</em>. ${esc(q.why)}</div>`).join("")}</div>`:""}
    <div class="row">${AI&&Q.scope?`<button class="btn gold" id="aiNext">AI: drill my misses</button>`:""}<button class="btn ${AI&&Q.scope?"":"gold"}" id="again2">${Q.exam?"New exam":Q.ai?"New drill":"Retake"}</button>${Q.exam?`<button class="btn ghost" id="done2">Back to domains</button>`:""}</div>
    ${aiErr?`<p class="msg bad">${esc(aiErr)}</p>`:""}</div>`;
  $("again2").onclick=()=>{aiErr="";if(Q.exam)startExam();else if(Q.ai)aiDrill(Q.scope);else{quiz=newQuiz(Q.src,Q.qs[0].dom,{target:Q.target,kind:Q.kind,ref:Q.ref,scope:Q.scope,src:Q.src});renderQuiz()}};
  if($("aiNext"))$("aiNext").onclick=()=>aiDrill(Q.scope);
  if($("done2"))$("done2").onclick=()=>{quiz=null;rerender()};
  if($("quitQ"))$("quitQ").onclick=()=>{quiz=null;rerender()};
}

/* ================= AI ================= */
const WHO="The learner is Robert (goes by Big Dawg), a SOC analyst with 5+ years in banking security, an MBA, and a CISSP who is refreshing his knowledge. He learns best from plain English, short sentences and real-world analogies (football and security operations work well).";
function aiErrMsg(e){const c=e&&e.code;return c==="rate_limited"?"The AI is busy. Give it a minute, then try again.":c==="not_granted"||c==="sampling_disabled"?"AI is turned off for this page. Allow it from the page's permissions to use the coach.":c==="invalid_json"?"The AI sent back something unreadable. Try again.":"The AI couldn't build that right now. Try again."}
function validQs(r){const a=(r&&Array.isArray(r.qs))?r.qs:[];return a.filter(q=>q&&typeof q.stem==="string"&&Array.isArray(q.options)&&q.options.length===4&&q.options.every(o=>typeof o==="string"&&o.trim())&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<4).map(q=>[q.stem,q.options,q.answer,String(q.why||"")])}
async function aiDrill(scope){
  if(!AI||aiBusy)return;aiBusy=true;aiErr="";
  const busyEl=$(scope.target);if(busyEl)busyEl.insertAdjacentHTML("afterbegin",`<div class="aiwait" id="aiwait"><span class="dot"></span>Building questions from your answers…</div>`);
  const h=histFor(scope.key).slice(-40);const miss=h.filter(x=>!x.ok).slice(-12),hit=h.filter(x=>x.ok).slice(-10);
  const style=scope.level==="ccna"?"CCNA-level networking questions (Cisco 200-301 depth: specific, technical, scenario-based, including subnetting math when it fits) that also tie back to security where natural":"CISSP-style questions written for a security manager: scenario-based, choose the BEST or FIRST answer, business and risk focused";
  const prompt=`${WHO}

Write 5 NEW multiple-choice ${style}, for this topic: ${scope.label}.
Topic anchor from his own notes: ${scope.ctx}

${miss.length?`He MISSED these recently. Target the concepts underneath them from new angles (don't repeat the same question):\n${miss.map(m=>`- Q: ${m.s} | Correct: ${m.a} | He picked: ${m.p}`).join("\n")}`:"He hasn't missed anything here yet. Probe the trickiest parts of the topic."}
${hit.length?`He got these right. Push one level harder on related ideas instead of repeating them:\n${hit.map(m=>`- ${m.s}`).join("\n")}`:""}

Rules: exactly 4 options, one clearly correct answer, plausible wrong answers that reflect real misconceptions, no "all of the above" or "none of the above". Vary which position the correct answer is in. Every fact must be accurate. The explanation is 1 to 2 short sentences in plain English that say why the answer is right, with an analogy when it helps. No em dashes.
Reply with only JSON: {"qs":[{"stem":"...","options":["...","...","...","..."],"answer":0,"why":"..."}]}`;
  try{const r=await AI.json(prompt,{modelTier:"default",cache:false});const qs=validQs(r);
    if(qs.length<2)throw{code:"invalid_json"};
    quiz=Object.assign(newQuiz(qs,{key:scope.key,tag:scope.tag,short:scope.label},{target:scope.target,kind:"ai",ai:true,label:scope.label,scope}),{});quiz.qs=qs.map(q=>mkQ({key:scope.key,tag:scope.tag,short:scope.label},q));
  }catch(e){aiErr=aiErrMsg(e)}
  aiBusy=false;
  if(quiz&&quiz.ai&&!aiErr)renderQuiz();else{const w=$("aiwait");if(w)w.remove();if(quiz&&quiz.i>=quiz.qs.length)renderQuiz();else rerender()}
}
async function explain(q){
  if(!AI||q.exBusy)return;q.exBusy=true;renderQuiz();
  try{const r=await AI(`${WHO}

Question: ${q.stem}
Options: ${q.opts.map((o,i)=>"ABCD"[i]+") "+o).join(" | ")}
Correct answer: ${q.opts[q.ans]}
He picked: ${q.opts[q.pick]}

Explain this to him in under 110 words. Start with the core idea in one plain sentence, give one real-world analogy, and ${q.pick===q.ans?"add one related fact that would trip up most test takers":"say exactly why his pick is wrong"}. No headings, no bullet points, no em dashes.`,{modelTier:"default",cache:false});
    q.ex=(r&&r.text||"").trim()||"No explanation came back. Try again.";
  }catch(e){q.ex=aiErrMsg(e)}
  q.exBusy=false;renderQuiz();
}
function renderCoach(scope){
  const h=histFor(scope.key);const recent=h.slice(-40);const miss=recent.filter(x=>!x.ok);
  const el=$(scope.target);
  el.innerHTML=`<div class="coach"><p class="eyebrow">AI coach</p>
    <p class="words">Every answer you give gets remembered. The coach reads what you missed and what you nailed, then writes brand new questions aimed at your weak spots, one level harder each round.</p>
    <div class="cstats"><div><b>${h.length}</b><span>answers logged</span></div><div><b>${recent.length?Math.round((recent.length-miss.length)/recent.length*100)+"%":"–"}</b><span>recent accuracy</span></div><div><b>${miss.length}</b><span>recent misses</span></div></div>
    ${miss.length?`<div><p class="eyebrow" style="margin-bottom:8px">Your weak spots</p><div class="missed">${miss.slice(-5).reverse().map(m=>`<div>${esc(m.s)}<br><em>${esc(m.a)}</em></div>`).join("")}</div></div>`:`<p class="muted" style="font-size:14px">${h.length?"No recent misses. The coach will push you harder.":"Take the regular quiz first so the coach has something to work from, or start now and it'll probe the hardest parts."}</p>`}
    ${AI?`<button class="btn gold wide" id="aiGo" ${aiBusy?"disabled":""}>${aiBusy?"Building…":"Build 5 new questions from my answers"}</button>`:`<p class="msg">AI turns on after you unlock with your passcode (button at the bottom right).</p>`}
    ${aiErr?`<p class="msg bad">${esc(aiErr)}</p>`:""}</div>`;
  if($("aiGo"))$("aiGo").onclick=()=>aiDrill(scope);
}

/* ================= NETWORK LAB ================= */
function renderLab(){
  if(!mod){
    $("main").innerHTML=`<div class="dhead"><div><p class="eyebrow">CCNA depth · CISSP angle</p><h2>Network Lab</h2></div><div class="stats"><span>Lab score <b>${netScore()}%</b></span><span>Subnets <b>${S.subnet.r}/${S.subnet.t}</b></span></div></div>
      <p class="words">Domain 4 asks you to think like a manager about networks. This lab makes you understand them like an engineer, at the level of Cisco's CCNA, so the CISSP questions get easy. Work top to bottom: each module builds on the last.</p>
      <div class="mods">${NET.map((m,i)=>{const b=(S.net[m.id]||{}).best;return `<button class="mod" data-m="${m.id}"><span class="mn">${String(i+1).padStart(2,"0")}</span><span class="mt"><b>${esc(m.title)}</b><small>${esc(m.sub)}</small></span><span class="ms">${b==null?"New":Math.round(b*100)+"%"}</span></button>`}).join("")}
      <button class="mod drillmod" data-m="drill"><span class="mn">∞</span><span class="mt"><b>Subnetting drill</b><small>Endless random problems. The fastest way to get fluent.</small></span><span class="ms">${S.subnet.t?Math.round(S.subnet.r/S.subnet.t*100)+"%":"Go"}</span></button></div>`;
    $("main").querySelectorAll(".mod").forEach(b=>b.onclick=()=>{mod=b.dataset.m;netMode=mod==="drill"?"drill":"learn";quiz=null;aiErr="";drill=null;renderLab();toTop()});
    return;
  }
  if(mod==="drill")return renderDrill();
  const m=NET.find(x=>x.id===mod);const idx=NET.indexOf(m);
  $("main").innerHTML=`<div class="dhead"><div><button class="link" id="labBack">← Network Lab</button><p class="eyebrow" style="margin-top:6px">Module ${idx+1} of ${NET.length}</p><h2>${esc(m.title)}</h2></div></div>
    <div class="modes four" role="group" aria-label="Mode">${[["learn","Learn"],["quiz","Quiz"],["coach","AI coach"],["next","Next →"]].map(([k,l])=>`<button data-n="${k}" aria-pressed="${netMode===k}">${l}</button>`).join("")}</div>
    <div id="body" class="stack"></div>`;
  $("labBack").onclick=()=>{mod=null;quiz=null;renderLab()};
  $("main").querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{if(b.dataset.n==="next"){mod=NET[(idx+1)%NET.length].id;netMode="learn";quiz=null;renderLab();toTop();return}netMode=b.dataset.n;quiz=null;aiErr="";renderLab()});
  const scope={key:"N:"+m.id,label:"Networking: "+m.title+" ("+m.sub+")",level:"ccna",ctx:m.idea+" "+m.cissp,target:"body",tag:"NET"};
  if(netMode==="learn"){
    $("body").innerHTML=`<p class="idea">${esc(m.idea)}</p><div class="analogy"><b>Think of it like this</b>${esc(m.analogy)}</div>
      <div><p class="eyebrow" style="margin-bottom:8px">What you need to know</p><ul class="list hooks">${m.pts.map(x=>`<li><span class="k">▸</span><span>${esc(x)}</span></li>`).join("")}</ul></div>
      <div class="rule"><b>CISSP angle</b>${esc(m.cissp)}</div>
      ${m.id==="n4"?`<div class="rule steel"><b>Practice the math</b>The subnetting drill gives you endless problems. <button class="link inline" id="toDrill">Open the drill</button></div>`:""}
      <div class="cnav"><span></span><button class="btn gold" id="toQuiz">Take the quiz</button></div>`;
    $("toQuiz").onclick=()=>{netMode="quiz";renderLab()};
    if($("toDrill"))$("toDrill").onclick=()=>{mod="drill";netMode="drill";drill=null;renderLab()};
  }else if(netMode==="quiz"){
    if(!quiz)quiz=newQuiz(m.qs,{key:scope.key,tag:"NET",short:m.title},{target:"body",kind:"net",ref:m.id,scope,src:m.qs});renderQuiz();
  }else{if(quiz&&quiz.ai)renderQuiz();else renderCoach(scope)}
}

/* subnetting drill: pure math, no AI needed */
const ip2n=a=>a.reduce((x,o)=>x*256+o,0);const n2ip=n=>[24,16,8,0].map(s=>Math.floor(n/2**s)%256).join(".");
function newDrill(){
  const p=16+Math.floor(Math.random()*15);
  const first=[10,172,192][Math.floor(Math.random()*3)];
  const o=[first,first===172?16+Math.floor(Math.random()*16):first===192?168:Math.floor(Math.random()*256),Math.floor(Math.random()*256),1+Math.floor(Math.random()*254)];
  const ipn=ip2n(o);const size=2**(32-p);const net=Math.floor(ipn/size)*size;const bc=net+size-1;
  const kinds=[["network","What is the network address?",n2ip(net)],["broadcast","What is the broadcast address?",n2ip(bc)],["hosts","How many usable hosts?",String(size-2)],["first","What is the first usable host?",n2ip(net+1)],["last","What is the last usable host?",n2ip(bc-1)],["mask","What is the subnet mask?",n2ip(2**32-size)]];
  const k=kinds[Math.floor(Math.random()*kinds.length)];
  return {ip:n2ip(ipn),p,q:k[1],ans:k[2],kind:k[0],size,net:n2ip(net),bc:n2ip(bc),mask:n2ip(2**32-size),given:null};
}
function renderDrill(){
  if(!drill)drill=newDrill();const d=drill;const done=d.given!=null;const ok=done&&d.given.replace(/\s/g,"")===d.ans;
  $("main").innerHTML=`<div class="dhead"><div><button class="link" id="labBack">← Network Lab</button><h2 style="margin-top:6px">Subnetting drill</h2></div><div class="stats"><span>Score <b>${S.subnet.r}/${S.subnet.t}</b></span></div></div>
    <div class="subnet"><p class="eyebrow">Problem</p><p class="addr">${d.ip}<span>/${d.p}</span></p><p class="stem">${d.q}</p>
      <form id="dForm" class="dform"><input id="dIn" type="text" inputmode="decimal" autocomplete="off" placeholder="${d.kind==="hosts"?"e.g. 62":"e.g. 192.168.1.64"}" ${done?"disabled":""} value="${done?esc(d.given):""}"><button class="btn gold" ${done?"disabled":""}>Check</button></form>
      ${done?`<div class="why"><b>${ok?"Correct.":"Not quite. Answer: "+d.ans}</b>
        <div class="work">/${d.p} leaves ${32-d.p} host bits, so each block is 2^${32-d.p} = ${d.size.toLocaleString()} addresses.<br>Mask ${d.mask}. Network ${d.net}. Broadcast ${d.bc}. Usable hosts ${(d.size-2).toLocaleString()}.</div></div>
        <div class="cnav"><span></span><button class="btn gold" id="dNext">Next problem</button></div>`:""}
    </div>
    <div class="rule steel"><b>The shortcut</b>Find the octet where the prefix lands. Block size = 256 − that octet of the mask. Count up in blocks until you pass your number. The block you're in starts at the network address and ends one before the next block (broadcast).</div>`;
  $("labBack").onclick=()=>{mod=null;drill=null;renderLab()};
  $("dForm").onsubmit=e=>{e.preventDefault();const v=$("dIn").value.trim();if(!v)return;d.given=v;S.subnet.t++;if(v.replace(/\s/g,"")===d.ans)S.subnet.r++;save();renderDrill()};
  if($("dNext"))$("dNext").onclick=()=>{drill=newDrill();renderDrill();setTimeout(()=>{const i=$("dIn");if(i)i.focus()},0)};
}

$("examBtn").onclick=startExam;
$("labBtn").onclick=()=>{view="lab";mod=null;quiz=null;rerender();toTop()};
let armed=false;
$("resetBtn").onclick=()=>{if(!armed){armed=true;$("resetBtn").textContent="Tap again to erase all progress";setTimeout(()=>{armed=false;$("resetBtn").textContent="Reset progress"},4000);return}
  armed=false;S=blank();save();quiz=null;ci=0;drill=null;$("resetBtn").textContent="Reset progress";rerender()};
rerender();
</script>
