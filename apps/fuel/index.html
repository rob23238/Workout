let AI=null;const aiSubs=new Set();
function useAI(){const [,f]=useState(0);useEffect(()=>{const h=()=>f(x=>x+1);aiSubs.add(h);return()=>aiSubs.delete(h)},[]);return AI}

function aiMsg(e){const c=e&&e.code;return c==="rate_limited"?"The AI is busy. Try again in a minute.":c==="not_granted"||c==="sampling_disabled"?"AI is off for this page. Allow it from the page permissions.":"The AI couldn't do that right now. Try again."}

function itemFromFood(fid,q=1){const f=F[fid];return {fid,q,name:f[0],serv:f[2],kcal:f[3],p:f[4],c:f[5],fat:f[6],fib:f[7],group:f[8],gluten:!!f[9],cost:COST[fid]||0}}
function totals(day){const t={kcal:0,p:0,c:0,fat:0,fib:0,cost:0};(day.log||[]).forEach(x=>{t.cost+=(x.cost||0)*x.q;t.kcal+=x.kcal*x.q;t.p+=x.p*x.q;t.c+=x.c*x.q;t.fat+=x.fat*x.q;t.fib+=x.fib*x.q});return t}
function hadGluten(day){if(day.glutenOverride!=null)return day.glutenOverride;return (day.log||[]).some(x=>x.gluten)}

function Rings({vals}){ // [{v,goal,color}]
  const size=150,sw=15,gap=3;
  return html`<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="Daily rings">
    ${vals.map((x,i)=>{const rad=size/2-sw/2-i*(sw+gap),C=2*Math.PI*rad,p=Math.min(1,x.goal?x.v/x.goal:0);
      return html`<g key=${i} transform="rotate(-90 ${size/2} ${size/2})">
        <circle cx=${size/2} cy=${size/2} r=${rad} fill="none" stroke=${x.color} strokeOpacity=".18" strokeWidth=${sw}/>
        <circle className="ringarc" cx=${size/2} cy=${size/2} r=${rad} fill="none" stroke=${x.color} strokeWidth=${sw} strokeLinecap="round" strokeDasharray=${C} strokeDashoffset=${C*(1-p)}/></g>`})}
  </svg>`;
}
function FoodDot({group,label}){const g=GROUP[group]||GROUP.custom;return html`<div className="dot" style=${{background:g[1]}} aria-hidden="true">${label}</div>`}
function initials(n){return n.replace(/[^A-Za-z ]/g,"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()}

/* ================= Today ================= */
function Today({st,set,openAdd,openSettings}){
  const k=dk(),day=st.days[k]||{},S=st.settings,t=totals(day),water=day.water||0;
  const left=Math.max(0,S.protein-t.p),kcalLeft=S.kcal-t.kcal;
  const upd=fn=>set(s=>{const d={...(s.days[k]||{log:[]})};fn(d);return {...s,days:{...s.days,[k]:d}}});
  const sugg=useMemo(()=>{
    if(left<5)return [];
    const opts=[["grilled",1],["chotub",1],["tenders",1],["chobani",1],["core",1],["mm",1],["ht",1],["egg",3],["cfanug",1]];
    return opts.map(([id,q])=>({id,q,p:F[id][4]*q,kcal:F[id][3]*q}))
      .filter(o=>o.kcal<=kcalLeft+60)
      .sort((a,b)=>Math.abs(left-a.p)-Math.abs(left-b.p)).slice(0,4);
  },[left,kcalLeft]);
  const date=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  return html`<${React.Fragment}>
  <div className="top"><div><div className="eyebrow">${date}</div><h1>Today</h1></div>
    <button className="iconbtn" aria-label="Targets and settings" onClick=${openSettings}>${I.gear}</button></div>

  <div className="sec"><div className="card">
    <div className="pad rings">
      <${Rings} vals=${[{v:t.p,goal:S.protein,color:"var(--berry)"},{v:t.kcal,goal:S.kcal,color:"var(--potato)"},{v:water,goal:S.water,color:"var(--water)"}]}/>
      <div className="legend">
        <div className="lg"><div className="k"><i style=${{background:"var(--berry)"}}></i>Protein</div><div className="v">${r(t.p)}<span> / ${S.protein} g</span></div></div>
        <div className="lg"><div className="k"><i style=${{background:"var(--potato)"}}></i>Calories</div><div className="v">${r(t.kcal)}<span> / ${S.kcal}</span></div></div>
        <div className="lg"><div className="k"><i style=${{background:"var(--water)"}}></i>Water</div><div className="v">${water}<span> / ${S.water} bottles</span></div></div>
      </div>
    </div>
    <div className="macros"><div><b>${r(t.c)} g</b><span>Carbs</span></div><div><b>${r(t.fat)} g</b><span>Fat</span></div><div><b>${r(t.fib)} g</b><span>Fiber · 35+</span></div><div><b>${money(t.cost)}</b><span>Food today</span></div></div>
  </div></div>

  ${left>=5?html`<div className="sec"><div className="sechead"><h2>Next up</h2><small>${r(left)} g protein to go</small></div>
    <div className="next">${sugg.map(o=>html`<button key=${o.id} className="sugg" onClick=${()=>{upd(d=>{d.log=[...(d.log||[]),itemFromFood(o.id,o.q)]});}}>
      <div className="n">${o.q>1?o.q+" × ":""}${F[o.id][0]}</div><div className="m">+${r(o.p)} g protein · ${r(o.kcal)} cal</div><div className="add">Log it</div></button>`)}</div></div>`
  :html`<div className="sec"><div className="callout"><h3>Protein's done for today.</h3>Eat the rest of the day for hunger and training, not to chase the number.</div></div>`}

  <div className="sec"><div className="sechead"><h2>Eaten</h2><button className="link" onClick=${openAdd}>Add food</button></div>
    <div className="card"><div className="rows">
      ${(day.log||[]).length?(day.log.map((x,i)=>html`<div className="row" key=${i}>
        <${FoodDot} group=${x.group} label=${initials(x.name)}/>
        <div className="t"><div className="n">${x.name}</div><div className="s">${r(x.p*x.q)} g protein · ${r(x.kcal*x.q)} cal${x.gluten?" · gluten":""}</div></div>
        <div className="qty"><button aria-label="Less ${x.name}" onClick=${()=>upd(d=>{const l=[...d.log];const nq=l[i].q-(l[i].q>1?1:.5);if(nq<=0)l.splice(i,1);else l[i]={...l[i],q:nq};d.log=l})}>−</button>
          <b>${x.q}</b><button aria-label="More ${x.name}" onClick=${()=>upd(d=>{const l=[...d.log];l[i]={...l[i],q:l[i].q+(l[i].q<1?.5:1)};d.log=l})}>+</button></div></div>`))
      :html`<div className="empty">Nothing logged yet. Tap a recipe under Recipes, a suggestion above, or Add food.</div>`}
    </div></div>
    <button className="btn" onClick=${openAdd} style=${{justifySelf:"start"}}>Add food</button>
  </div>

  <div className="sec"><h2>Water</h2><div className="card water">
    <div className="drops" role="group" aria-label="Water bottles">${Array.from({length:Math.max(S.water,water)},(_,i)=>html`<button key=${i} aria-label=${"Bottle "+(i+1)} aria-pressed=${i<water} onClick=${()=>upd(d=>{d.water=i<water?i:i+1})}><${Drop} on=${i<water}/></button>`)}</div>
    <div className="qty"><button aria-label="Add a bottle" onClick=${()=>upd(d=>{d.water=(d.water||0)+1})}>+</button></div>
  </div><div className="note">One bottle is 16.9 oz. ${S.water} bottles is about ${r(S.water*16.9)} oz.</div></div>

function AIDescribe({add}){
  const ai=useAI();const [txt,setTxt]=useState(""),[busy,setBusy]=useState(false),[err,setErr]=useState(""),[got,setGot]=useState(null);
  if(!ai)return html`<div className="note">Not sure of the numbers? Unlock AI with your passcode (bottom right) to describe meals in plain words.</div>`;
  const go=async()=>{if(!txt.trim()||busy)return;setBusy(true);setErr("");setGot(null);
    try{const r=await ai.json(`${WHO}

He ate this: """${txt.trim().slice(0,600)}"""
Break it into separate foods and estimate each one realistically for a typical portion (or the portion he gave). For restaurant items use the restaurant's published numbers if you know them.
Reply with only JSON: {"items":[{"name":"short name","kcal":0,"p":0,"c":0,"fat":0,"fib":0,"gluten":false}],"note":"one short sentence on the biggest uncertainty"}`,{modelTier:"default",cache:false});
      const items=(r&&Array.isArray(r.items)?r.items:[]).filter(x=>x&&x.name).map(x=>({fid:null,q:1,name:String(x.name).slice(0,60),serv:"AI estimate",kcal:Math.max(0,+x.kcal||0),p:Math.max(0,+x.p||0),c:Math.max(0,+x.c||0),fat:Math.max(0,+x.fat||0),fib:Math.max(0,+x.fib||0),group:"custom",gluten:!!x.gluten,cost:0,ai:true}));
      if(!items.length)throw{code:"invalid_json"};setGot({items,note:String(r.note||"")});
    }catch(e){setErr(aiMsg(e))}setBusy(false)};
  return html`<div className="card pad" style=${{display:"grid",gap:"10px"}}>
    <h2 style=${{fontSize:"18px"}}>Describe it, AI does the math</h2>
    <textarea className="input" id="aidesc" style=${{minHeight:"80px"}} placeholder="e.g. Chipotle bowl with double chicken, white rice, black beans, cheese and mild salsa" value=${txt} onInput=${e=>setTxt(e.target.value)}></textarea>
    <button className="btn" disabled=${busy} style=${{opacity:busy?.6:1}} onClick=${go}>${busy?"Estimating…":"Estimate it"}</button>
    ${err?html`<div className="note" style=${{color:"var(--warn)"}}>${err}</div>`:null}
    ${got?html`<div className="card"><div className="rows">${got.items.map((x,i)=>html`<div className="row" key=${i}><${FoodDot} group="custom" label=${initials(x.name)}/>
      <div className="t"><div className="n">${x.name}<span className="est">AI</span></div><div className="s">${r(x.p)} g protein · ${r(x.kcal)} cal${x.gluten?" · gluten":""}</div></div><span></span></div>`)}</div></div>
      ${got.note?html`<div className="note">${got.note}</div>`:null}
      <button className="btn" onClick=${()=>{got.items.forEach(add);setGot(null);setTxt("")}}>Log all ${got.items.length}</button>`:null}</div>`;
}

const money=n=>"$"+(Math.round(n*100)/100).toFixed(2);
function recipeTotals(items,servings){const t={kcal:0,p:0,c:0,fat:0,fib:0,cost:0,gluten:false};
  items.forEach(([id,q])=>{const f=F[id];if(!f)return;t.kcal+=f[3]*q;t.p+=f[4]*q;t.c+=f[5]*q;t.fat+=f[6]*q;t.fib+=f[7]*q;t.cost+=(COST[id]||0)*q;if(f[9])t.gluten=true});
  const n=Math.max(1,servings||1);Object.keys(t).forEach(k=>{if(k!=="gluten")t[k]/=n});return t}
function mealTotals(m){return recipeTotals(m.items,1)}

/* ================= Gut ================= */
function Gut({st,set}){
  const k=dk(),day=st.days[k]||{},g=hadGluten(day);
  const upd=fn=>set(s=>{const d={...(s.days[k]||{log:[]})};fn(d);return {...s,days:{...s.days,[k]:d}}});
  const hist=daysBack(30).map(kk=>({k:kk,d:st.days[kk]||{}})).filter(x=>x.d.bloat!=null);
  const gd=hist.filter(x=>hadGluten(x.d)),nd=hist.filter(x=>!hadGluten(x.d));
  const avg=a=>a.length?(a.reduce((s,x)=>s+x.d.bloat,0)/a.length):null;
  const LV=["None","Mild","Medium","Bad"];
  const ready=gd.length>=4&&nd.length>=4;
  return html`<${React.Fragment}>
  <div className="top"><div><div className="eyebrow">Bloating vs. gluten</div><h1>Gut check</h1></div></div>
  <p className="lede">Rate tonight's bloating. The app already knows if today had gluten from what you logged. After a couple of weeks you'll see whether it's really the gluten, with your own numbers.</p>
  <div className="sec"><h2>Tonight</h2><div className="card pad" style=${{display:"grid",gap:"14px"}}>
    <div className="seg" role="group" aria-label="Bloating today">${LV.map((l,i)=>html`<button key=${i} aria-pressed=${day.bloat===i} onClick=${()=>upd(d=>{d.bloat=i})}>${l}</button>`)}</div>
    <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",gap:"10px",flexWrap:"wrap"}}>
      <span>Gluten today: <b>${g?"Yes":"No"}</b> <span className="note">${day.glutenOverride!=null?"(set by you)":"(from your log)"}</span></span>
      <button className="btn sec2 small" onClick=${()=>upd(d=>{d.glutenOverride=!g})}>Mark as ${g?"no gluten":"had gluten"}</button></div></div></div>
  <div className="sec"><div className="stats">
    <div className="stat"><span>Gluten days</span><b>${avg(gd)!=null?avg(gd).toFixed(1):"–"}</b><small>avg bloat · ${gd.length} days</small></div>
    <div className="stat"><span>Gluten-free days</span><b>${avg(nd)!=null?avg(nd).toFixed(1):"–"}</b><small>avg bloat · ${nd.length} days</small></div></div>
    <div className=${"callout"+(ready?"":" warm")}>${ready
      ?(avg(gd)-avg(nd)>=0.7?"Your gluten days run clearly more bloated. That points to a tolerance pattern worth respecting.":avg(gd)-avg(nd)<=0.3?"Not much difference so far. Bloating may be about portion size, fried food, or how fast you eat, not gluten.":"A small difference. Keep logging another week before deciding.")
      :`Log at least 4 days of each to see a pattern. You have ${gd.length} gluten and ${nd.length} gluten-free so far. Scale: 0 none, 3 bad.`}</div></div>
  <div className="sec"><div className="callout"><h3>Read this before cutting gluten for good</h3>
    <ul><li>Feeling better without pizza, pasta and chips can also be lower fat, fried food and portion size. Test bread or rice-free days separately to tell them apart.</li>
    <li>This tracks how you feel. It can't tell tolerance from celiac disease.</li>
    <li>If you ever want a celiac test, it only works while you're still eating gluten. Get tested before going strictly gluten-free, and see a doctor sooner for weight loss you didn't plan, diarrhea that won't quit, or blood in your stool.</li></ul></div></div>
  ${hist.length?html`<div className="sec"><h2>Last 30 days</h2><div className="card" style=${{overflowX:"auto"}}><table className="tbl"><thead><tr><th>Day</th><th>Gluten</th><th className="r">Bloat</th></tr></thead><tbody>
    ${hist.map(x=>html`<tr key=${x.k}><td>${new Date(x.k+"T12:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}</td><td>${hadGluten(x.d)?"Yes":"No"}</td><td className="r">${LV[x.d.bloat]}</td></tr>`)}</tbody></table></div></div>`:null}<//>`;
}

/* ================= Progress ================= */
function Progress({st,set}){
  const S=st.settings,ks=daysBack(28);
  const w=ks.map(k=>({k,v:parseFloat((st.days[k]||{}).weight)})).reverse();
  const wk=a=>{const v=a.filter(x=>!isNaN(x.v));return v.length?v.reduce((s,x)=>s+x.v,0)/v.length:null};
  const thisWk=wk(w.slice(21)),lastWk=wk(w.slice(14,21));
  const delta=thisWk!=null&&lastWk!=null?thisWk-lastWk:null;
  const pdays=ks.slice(0,7).filter(k=>totals(st.days[k]||{}).p>=S.protein*0.9).length;
  const pts=w.filter(x=>!isNaN(x.v));
  const W=340,H=120,pad=14;
  let svg=null;
  if(pts.length>=2){
    const lo=Math.min(...pts.map(p=>p.v))-.5,hi=Math.max(...pts.map(p=>p.v))+.5;
    const X=k=>pad+(w.findIndex(x=>x.k===k)/(w.length-1))*(W-pad*2),Y=v=>pad+(1-(v-lo)/(hi-lo))*(H-pad*2-14);
    const line=pts.map(p=>X(p.k).toFixed(1)+","+Y(p.v).toFixed(1)).join(" ");
    const last=pts[pts.length-1];
    svg=html`<svg className="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight, last 4 weeks">
      <line x1=${pad} x2=${W-pad} y1=${Y(hi-.5)} y2=${Y(hi-.5)} stroke="var(--line)"/><line x1=${pad} x2=${W-pad} y1=${Y(lo+.5)} y2=${Y(lo+.5)} stroke="var(--line)"/>
      <text x=${W-pad} y=${Y(hi-.5)-4} textAnchor="end" fontSize="11" fill="var(--muted)">${(hi-.5).toFixed(1)}</text>
      <text x=${W-pad} y=${Y(lo+.5)+13} textAnchor="end" fontSize="11" fill="var(--muted)">${(lo+.5).toFixed(1)}</text>
      <polyline points=${line} fill="none" stroke="var(--accent)" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
      ${pts.map(p=>html`<circle key=${p.k} cx=${X(p.k)} cy=${Y(p.v)} r="2.5" fill="var(--accent)"/>`)}
      <circle cx=${X(last.k)} cy=${Y(last.v)} r="5" fill="var(--accent)" stroke="var(--card)" strokeWidth="2"/>
      <text x=${pad} y=${H-2} fontSize="11" fill="var(--muted)">4 weeks ago</text><text x=${W-pad} y=${H-2} textAnchor="end" fontSize="11" fill="var(--muted)">Today</text></svg>`;
  }
  const waist=st.waist||{},wk0=dk(),[copied,setCopied]=useState(false),[box,setBox]=useState(false),ref=useRef(null);
  const text=()=>{const L=daysBack(7).reverse().map(k=>{const d=st.days[k]||{},t=totals(d);return `${k}: wt ${d.weight||"-"} | ${r(t.p)}g protein | ${r(t.kcal)} cal | ${money(t.cost)} | water ${d.water||0} | gluten ${hadGluten(d)?"Y":"N"} | bloat ${d.bloat!=null?d.bloat:"-"} | ate: ${(d.log||[]).map(x=>(x.q!==1?x.q+"x ":"")+x.name).join(", ")||"-"}`});
    const lw=Object.keys(waist).sort().slice(-1)[0];
    return `Fuel & Consistency week (targets ${S.protein}g protein / ${S.kcal} cal)\n7-day avg ${thisWk?thisWk.toFixed(1):"-"} lb, prior week ${lastWk?lastWk.toFixed(1):"-"} lb${lw?`, waist ${waist[lw]} in (${lw})`:""}\n`+L.join("\n")};
  const ai=useAI();const [ck,setCk]=useState({});
  const checkIn=async()=>{if(!ai||ck.busy)return;setCk({busy:true});
    try{const res=await ai(`${WHO}

Here is his last 7 days from his food app:
${text()}

Give him a weekly check-in in under 170 words: what went well, the one thing to change next week, and whether to adjust calories based on his recomp rules (avg dropping 0.25 to 0.75 lb a week with lifts holding: keep going; flat 3 weeks with steady waist: trim 150 to 200 calories; dropping fast: add 150 to 200 back, mostly carbs). If gluten days and bloating line up, say so. Plain sentences, no headings.`,{modelTier:"default",cache:false});setCk({text:(res&&res.text||"").trim()})}catch(e){setCk({err:aiMsg(e)})}};
  const copy=()=>{const t=text();try{navigator.clipboard.writeText(t).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),1600)},()=>{setBox(true)})}catch(e){setBox(true)}};
  return html`<${React.Fragment}>
  <div className="top"><div><div className="eyebrow">Trends, not single days</div><h1>Progress</h1></div></div>
  <div className="sec"><div className="stats">
    <div className="stat"><span>This week's average</span><b>${thisWk?thisWk.toFixed(1):"–"}</b><small>lb</small></div>
    <div className="stat"><span>vs. last week</span><b style=${{color:delta==null?"inherit":delta<=0?"var(--accent)":"var(--warn)"}}>${delta==null?"–":(delta>0?"+":"")+delta.toFixed(1)}</b><small>lb</small></div>
    <div className="stat"><span>Protein days</span><b>${pdays}</b><small>of the last 7</small></div>
    <div className="stat"><span>Waist</span><b>${waist[wk0]||Object.values(waist).slice(-1)[0]||"–"}</b><small>in, at the navel</small></div></div></div>
  <div className="sec"><h2>Weight</h2><div className="card pad">${svg||html`<div className="note">Log a few morning weigh-ins on Today and your trend line shows up here.</div>`}</div></div>
  <div className="sec"><h2>Waist</h2><div className="card pad field"><label htmlFor="waist" style=${{fontWeight:600}}>This week</label>
    <input id="waist" className="input" inputMode="decimal" placeholder="inches" value=${waist[wk0]||""} onChange=${e=>{const v=e.target.value;set(s=>({...s,waist:{...(s.waist||{}),[wk0]:v}}))}}/></div>
    <div className="note">Once a week, same morning, tape at the navel, relaxed. During a recomp the waist often moves while the scale barely does.</div></div>
  <div className="sec"><div className="callout"><h3>Scale jumped after a big meal?</h3>
    <ul><li><b>Water from carbs.</b> Each gram of stored carbohydrate holds about 3 grams of water. A pizza or pasta night can add 2–4 lb overnight.</li>
    <li><b>Salt.</b> Restaurant food is salty, and your body holds water until it clears, usually 2–3 days.</li>
    <li><b>Food still in transit.</b> A big meal weighs something until it's digested.</li>
    <li><b>Actual fat.</b> Gaining a pound of fat takes roughly 3,500 calories above maintenance. One heavy weekend usually adds a fraction of that.</li></ul>
    <p style=${{margin:"8px 0 0"}}>Go back to your normal plan the next day, with no skipping meals and no extra cardio as payback. Judge it on next week's average.</p></div></div>
  <div className="sec"><h2>Weekly check-in</h2><p className="note" style=${{margin:0}}>${ai?"Get an AI check-in on your last 7 days right here, or copy the week for a longer chat with Claude.":"Copy the week and paste it to Claude. Same loop as the workout app."}</p>
    <div className="btns">${ai?html`<button className="btn" disabled=${ck.busy} onClick=${checkIn}>${ck.busy?"Reading your week…":"AI check-in"}</button>`:null}<button className=${ai?"btn sec2":"btn"} onClick=${copy}>${copied?"Copied":"Copy this week"}</button></div>
    ${ck.err?html`<div className="note" style=${{color:"var(--warn)"}}>${ck.err}</div>`:null}
    ${ck.text?html`<div className="callout" style=${{whiteSpace:"pre-wrap"}}>${ck.text}</div>`:null}
    ${box?html`<textarea ref=${ref} className="input" style=${{minHeight:"160px",fontSize:"13px"}} readOnly value=${text()} onFocus=${e=>e.target.select()} aria-label="Week log"></textarea>`:null}</div><//>`;
}

/* ================= App ================= */
const TABS=[["today","Today",I.today],["recipes","Recipes",I.meals],["grocery","Groceries",I.list],["gut","Gut",I.gut],["progress","Progress",I.trend]];
function App(){
  const [st,setRaw]=useState(()=>{const s=load();return {days:{},grocery:{},custom:[],waist:{},recipes:[],budget:125,...s,settings:{...DEF,...(s.settings||{})}}});
  const setSt=fn=>setRaw(s=>({...(typeof fn==="function"?fn(s):fn),updatedAt:Date.now()}));
  const refDoc=useRef(null),tmr=useRef(null),[synced,setSynced]=useState(false);
  useEffect(()=>{(async()=>{try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);if(!db||!user)return;
    const id=await user.id();if(!id)return;const ref=db.collection("data/users/"+id).doc("fuel");
    const snap=await ref.get();refDoc.current=ref;
    if(snap.exists){const d=snap.data();setRaw(s=>((d.updatedAt||0)>(s.updatedAt||0))?{days:{},grocery:{},custom:[],waist:{},recipes:[],budget:125,...d,settings:{...DEF,...(d.settings||{})}}:{...s,updatedAt:s.updatedAt||Date.now()})}
    else setRaw(s=>({...s,updatedAt:s.updatedAt||Date.now()}));
    setSynced(true);
  }catch(e){}})()},[]);
  const [tab,setTab]=useState(()=>{try{const t=localStorage.getItem("fuel2-tab");return t==="meals"?"recipes":(t||"today")}catch(e){return "today"}});
  const [sheet,setSheet]=useState(null),[toast,setToast]=useState("");
  useEffect(()=>{save(st);if(!refDoc.current||!st.updatedAt)return;clearTimeout(tmr.current);
    tmr.current=setTimeout(()=>{refDoc.current.set(JSON.parse(JSON.stringify(st))).catch(()=>{})},800)},[st]);
  useEffect(()=>{try{localStorage.setItem("fuel2-tab",tab)}catch(e){}window.scrollTo(0,0)},[tab]);
  const flash=m=>{setToast(m);clearTimeout(flash.t);flash.t=setTimeout(()=>setToast(""),1600)};
  const addItems=items=>setSt(s=>{const k=dk(),d={...(s.days[k]||{log:[]})};d.log=[...(d.log||[]),...items];return {...s,days:{...s.days,[k]:d}}});
  const logRecipe=(rc,t,cost)=>{addItems([{fid:null,q:1,name:rc.name,serv:"1 serving",kcal:Math.round(t.kcal),p:Math.round(t.p),c:Math.round(t.c),fat:Math.round(t.fat),fib:Math.round(t.fib),group:"carb",gluten:t.gluten,cost}]);flash(rc.name+" logged")};
  const logMeal=m=>{addItems(m.items.map(([id,q])=>itemFromFood(id,q)));flash(m.name+" logged")};
  const page={today:html`<${Today} st=${st} set=${setSt} openAdd=${()=>setSheet("add")} openSettings=${()=>setSheet("settings")}/>`,
    recipes:html`<${Recipes} st=${st} set=${setSt} logMeal=${logMeal} logRecipe=${logRecipe} flash=${flash}/>`,grocery:html`<${Grocery} st=${st} set=${setSt}/>`,gut:html`<${Gut} st=${st} set=${setSt}/>`,progress:html`<${Progress} st=${st} set=${setSt}/>`}[tab];
  return html`<${React.Fragment}><main className="page">${page}</main>
    <div className="tabbar"><nav aria-label="Sections">${TABS.map(([id,l,ic])=>html`<button key=${id} aria-current=${tab===id?"page":undefined} onClick=${()=>setTab(id)}>${ic}<span>${l}</span></button>`)}</nav></div>
    ${sheet==="add"?html`<${AddSheet} close=${()=>setSheet(null)} add=${it=>{addItems([it]);flash(it.name+" added")}}/>`:null}
    ${sheet==="settings"?html`<${SettingsSheet} st=${st} set=${setSt} close=${()=>setSheet(null)}/>`:null}
    ${toast?html`<div className="toast" role="status">${toast}</div>`:null}<//>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
