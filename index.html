<script>
const S = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
const AD = "Functional Training", AH = "Functional Training · Hips", AC = "Functional Training · Core", FMF = "Flow Motion Fitness", HAM = "Hampton football", LW = "LW Calisthenics", MINE = "Your routine", WD = "Your hip Word doc";
const PULL_GUIDE = `
<h4>The big idea</h4>
<p>Your hands and arms are just <b>hooks</b>. Your back is the <b>engine</b>. Think of a tow truck: the hook grabs the car, but the winch does the pulling. If your biceps are doing the work, you're pulling the car with the hook.</p>
<div class="big">Don't pull yourself up. Pull the bar down to your chest.</div>
<h4>One rep, step by step</h4>
<ol>
<li><b>Grip.</b> Hands a little wider than your shoulders, thumbs wrapped. Squeeze the bar like you're trying to crush it. A hard grip turns on your whole back.</li>
<li><b>Get tight.</b> Legs together, squeeze your glutes, ribs down, toes slightly in front of you. No banana back, no swinging. A stiff body = all the power goes up.</li>
<li><b>Dead hang.</b> Arms fully straight. Feel the stretch in your armpits. That's your lats loaded like a slingshot.</li>
<li><b>Shoulders down first (arms stay straight).</b> Pull your shoulders away from your ears, like putting your shoulder blades in your back pockets. You rise about an inch. This is the rep starting from your back. Skip this and your arms take over.</li>
<li><b>Elbows to your back pockets.</b> Now bend. Drive your elbows down and back toward your hips, like you're trying to elbow someone standing behind you. Elbows go down, not forward. Elbows forward = it turns into a curl.</li>
<li><b>Chest to the bar.</b> Lead with your chest, not your chin. Chin clears the bar, pause 1 sec, shoulders still down (not shrugged up by your ears).</li>
<li><b>Lower in 3 sec.</b> Control it all the way back to a full dead hang. The way down builds as much strength as the way up.</li>
<li><b>Reset.</b> Every rep starts over at step 4. No bouncing out of the bottom.</li>
</ol>
<h4>Where you should feel it</h4>
<p>The side of your back under your armpits and the middle of your back. Forearms and biceps will work some, but they should not be the first thing to burn.</p>
<div class="bad"><b>Stop the set if:</b> your shoulders shrug to your ears, your neck tightens, you kick or swing, your biceps burn before your back, or you can't get back to a full dead hang. That rep doesn't count. Ugly reps teach your body ugly pull-ups.</div>
<h4>Why this breaks the plateau</h4>
<ul>
<li><b>Weighted sets (vest)</b> make your body weight feel lighter later, like running in boots then switching to sneakers.</li>
<li><b>Slow sets</b> build control in the hardest spots, the bottom and the top.</li>
<li><b>Only perfect reps</b> means every rep trains the back, not the momentum. 15 clean reps beat 20 messy ones.</li>
<li><b>Full rest (2 min)</b> so every set is quality. You're practicing a skill, not just getting tired.</li>
</ul>
<h4>Quick self-check</h4>
<p>Do 1 scapular pull-up (step 4 only) before each set. If you can't feel your back doing that, you won't feel it in the full rep.</p>`;
const SS = "Superset: do the 1 then the 2 back to back, rest, repeat for all rounds.";
const DAYS = [
 {id:"mon", chip:"Mon", kicker:"Day 1 · Monday", title:"Pull + bench + arms + lower abs", time:"~55 min", stair:["30-min intervals","see StairMaster tab"], night:"Hip mobility A (no push-ups tonight, you did 100 with bench)",

    ["Scapular pull-ups, 2-sec hold","2 × 6","Hang with straight arms, pull your shoulders down away from your ears",LW,S("scapular pull ups form")],
    ["Straight-arm cable pulldown","1 × 12, light","Rope or bar on the high cable. Arms stay straight, push it down to your thighs. That squeeze under your armpits is your lats: the exact feeling you want in every pull-up","",S("straight arm cable pulldown lats")]]},
   {h:"Pull-ups to break the plateau", m:"14 min", guide:true, note:"Open the guide above before set 1. A sloppy rep doesn't count: end the set there. Rest timer is set to 2 min.", rows:[
    ["Set 1 · Weighted pull-ups","5 reps, 30 lb vest","Controlled, about 2 sec down",LW,S("weighted pull up form")],
    ["Set 2 · Weighted pull-ups","5 reps, vest","Same",LW,S("weighted pull up form")],
    ["Set 3 · Weighted pull-ups","5 reps, vest","Same",LW,S("weighted pull up form")],

/* ---------- Timers: rest standards by block type ----------
   Based on NSCA guidance: heavy compound lifts 2–3 min, accessory lifts 1–2 min,
   core/arms ~60 sec, explosive drills short, warm-ups and mobility move straight through. */
const REST_RULES = [
 [/warm-up|cool-down|hip finisher|hip session/i, 0, "Move straight through, no rest"],
 [/pull-ups to break|bench|^strength/i, 120, "Heavy lifts: 2 min so you hit the same weight every set"],
 [/calisthenics|pull-up volume/i, 90, "Skill + volume: 90 sec keeps every rep clean"],
 [/functional/i, 45, "Explosive drills: short rest, stay sharp"],
 [/hip strength/i, 30, "Holds + mobility: brief reset"],
 [/.*/, 60, "Accessories, arms + core: 60 sec keeps it moving"]];
const restFor = b => { const r = REST_RULES.find(x=>x[0].test(b.h)); return {sec: b.rest ?? r[1], why: r[2]}; };
const mins = t => { const m = String(t||"").match(/(\d+)/); return m ? +m[1] : 0; };
/* ---------- storage: db when available, this phone otherwise ---------- */
const cache = {};
const local = { get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48);
function keysFor(blocks){ const seen={}; return blocks.map(b=>b.rows.map(r=>{ let k=slug(r[0]); if(seen[k]) k+="-"+(++seen[k]); else seen[k]=1; return k; })); }

const RENAMED = {"feet-on-bench-push-ups":"incline-push-ups","dumbbell-curl-palms-up-3-sec-lowering":"dumbbell-curl-neutral-to-palms-up"};
function migrate(id, d){
  if(!d) return d;
  ["checks","logs"].forEach(f=>{ const o=d[f]; if(!o) return; Object.keys(o).forEach(k=>{ const base=k.replace(/-\d+$/,""), tail=k.slice(base.length); if(RENAMED[base] && !((RENAMED[base]+tail) in o)){ o[RENAMED[base]+tail]=o[k]; delete o[k]; } }); });
  const m = OLD_KEYS[id];
  ["checks","logs"].forEach(f=>{ const o=d[f]; if(!o) return; Object.keys(o).forEach(k=>{
    if(/^\d+-\d+$/.test(k)){ if(m && m[k] && !(m[k] in o)) o[m[k]]=o[k]; delete o[k]; }
    else if(/^[ab]\d$/.test(k)){ if(o[k]) d.legacyNight=(d.legacyNight||0)+1; delete o[k]; }
  }); });
  return d;
}
const docOf = id => cache[id] || (cache[id] = migrate(id, local.get("hy1-"+id)) || {checks:{}, logs:{}, night:{}, cal:"", push:false});
const writing = {}, pending = {};
function save(id){
  local.set("hy1-"+id, cache[id]);
  if(!db) return;
  pending[id] = true;
  if(writing[id]) return;
  (async function loop(){
    writing[id] = true;
    while(pending[id]){
      pending[id] = false;
      try{ await db.doc("week1/"+id).set(JSON.parse(JSON.stringify(cache[id]))); setSync("Synced to your account"); }
      catch(e){ setSync("Saved on this phone (sync failed)"); }
    }
    writing[id] = false;
  })();
}
let saveTimer = {};
function saveSoon(id){ clearTimeout(saveTimer[id]); saveTimer[id] = setTimeout(()=>save(id), 700); }
function setSync(t){ const el=document.getElementById("sync"); if(el) el.textContent=t; }

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tabsEl = document.getElementById("days"), app = document.getElementById("app");
const dot = l => `<span class="dot" style="background:${COLOR[l]||'#0D7A63'}">L${l}</span>`;

function rowHTML(prefix, key, r, d, loggable){
  const on = !!(d.checks||{})[key], cid = `c-${prefix}-${key}`;
  const logv = (d.logs||{})[key] || "";
  return `<div class="row${on?" is-done":""}"><input type="checkbox" id="${cid}" data-k="${key}"${on?" checked":""} aria-label="Done: ${esc(r[0])}"><div class="t"><label for="${cid}" style="cursor:pointer;display:block"><div class="name">${r[5]?`<span class="ss">${esc(r[5])}</span>`:""}${esc(r[0])}</div><div class="dose">${esc(r[1])}</div>${r[2]?`<div class="how">${esc(r[2])}</div>`:""}</label>${loggable?`<div class="logbox"><label for="l-${prefix}-${key}">Did</label><input id="l-${prefix}-${key}" data-log="${key}" inputmode="text" autocomplete="off" placeholder="weight × reps" value="${esc(logv)}"></div>`:""}${(r[3]||r[4])?`<div class="meta">${r[3]?`<span class="src">${esc(r[3])}</span>`:""}${r[4]?`<a class="vid" href="${esc(r[4])}" target="_blank" rel="noopener">${r[4].includes("results?search")?"Find video":"Watch video"} ↗</a>`:""}</div>`:""}</div></div>`;
}
function wire(id, total){
  const d = docOf(id);
  const upd = ()=>{ const n=Object.values(d.checks||{}).filter(Boolean).length; const f=document.getElementById("barfill"); if(f){ f.style.width=(total?Math.min(100,n/total*100):0)+"%"; document.getElementById("count").textContent=n+" / "+total; } };
  app.querySelectorAll('.row input[type=checkbox]').forEach(cb=>cb.addEventListener("change",()=>{
    d.checks = d.checks||{}; d.checks[cb.dataset.k]=cb.checked; cb.closest(".row").classList.toggle("is-done",cb.checked); upd(); save(id);
  }));
  app.querySelectorAll('input[data-log]').forEach(inp=>inp.addEventListener("input",()=>{ d.logs=d.logs||{}; d.logs[inp.dataset.log]=inp.value; saveSoon(id); }));
  const cal=document.getElementById("cal"); if(cal) cal.addEventListener("input",()=>{ d.cal=cal.value; saveSoon(id); });
  const pu=document.getElementById("pu"); if(pu) pu.addEventListener("change",()=>{ d.push=pu.checked; save(id); });
  const rb=document.getElementById("reset"); if(rb) rb.addEventListener("click",()=>{ d.checks={}; save(id); render(id); });
  upd();
}

function renderDay(day){
  const d = docOf(day.id);
  const rowCount = day.blocks.reduce((a,b)=>a+b.rows.length,0);
  const plan = PLAN_BY_DAY[day.id], night = NIGHT_BY_DAY[day.id], K = keysFor(day.blocks);
  const valid = new Set(K.flat()); Object.keys(d.checks||{}).forEach(k=>{ if(!valid.has(k)) delete d.checks[k]; });
  let h = `<div class="dayhead"><div class="kicker">${esc(day.kicker)} · Week 1</div><h2>${esc(day.title)}</h2><p>${esc(day.time)}</p>`;
  if(rowCount) h += alarmSetHTML();
  if(rowCount) h += `<div class="progress"><div class="bar"><i id="barfill"></i></div><b id="count">0 / ${rowCount}</b></div>`;
  h += `<div class="after">` + (plan?`<div class="pill"><strong>After</strong><span>${esc(PLANS[plan].h)} · <a href="#stair" data-go="stair" style="color:var(--warm);font-weight:700">open timer</a></span></div>`:"") + `${(SKILLS_BY_DAY[day.id]||[]).length?`<div class="pill" style="background:var(--accent-soft)"><strong style="color:var(--accent)">Builds</strong><span>${esc(SKILLS_BY_DAY[day.id].join(" · "))} · <a href="#cali" data-go="cali" style="color:var(--accent);font-weight:700">see progress</a></span></div>`:""}<div class="pill"><strong>Tonight</strong><span>Hip mobility ${night.toUpperCase()}${PUSH_BY_DAY[day.id]?" + 100 push-ups":""} · <a href="#night" data-go="night" style="color:var(--warm);font-weight:700">open</a></span></div></div></div>`;
  day.blocks.forEach((b,bi)=>{
    const rs = restFor(b), bm = mins(b.m);
    h += `<section class="block"><h3>${esc(b.h)}${b.m?` <small>${esc(b.m)}</small>`:""}</h3>`;
    if(bm) h += `<div class="tbar"><button class="tbtn" type="button" data-block="${bi}">▶ ${bm}:00 block</button>${rs.sec?`<button class="tbtn rest" type="button" data-rest="${rs.sec}">⏱ Rest ${fmt(rs.sec)}</button>`:""}</div><p class="restwhy">${esc(rs.why)}</p>`;
    if(b.guide) h += `<details class="guide"><summary>How to pull with your back</summary>${PULL_GUIDE}</details>`;
    h += b.note?`<p class="note">${esc(b.note)}</p>`:"";
    if(b.rows.length) h += `<div class="list">` + b.rows.map((r,ri)=>rowHTML(day.id, K[bi][ri], r, d, LOGGABLE.test(r[0]))).join("") + `</div>`;
    h += `</section>`;
  });
  if(plan) h += `<section class="block"><h3>StairMaster</h3><div class="field"><label for="cal">Calories</label><input id="cal" inputmode="numeric" placeholder="from the machine" value="${esc(d.cal||"")}"></div></section>`;
  if(rowCount) h += `<button class="reset" id="reset" type="button">Clear today's checkmarks</button>`;
  h += `<p class="foot">"Watch video" opens the exact video from your programs. "Find video" opens YouTube results for that exercise.</p>`;
  app.innerHTML = h; wire(day.id, rowCount);
  wireAlarmSet(()=>renderDay(day));
  app.querySelectorAll("[data-block]").forEach(btn=>btn.addEventListener("click",()=>{ const b=day.blocks[+btn.dataset.block]; startBlock(b.h, mins(b.m)*60); }));
  app.querySelectorAll("[data-rest]").forEach(btn=>btn.addEventListener("click",()=>startRest(+btn.dataset.rest)));
}

/* ---------- StairMaster timer ---------- */
let tState = {plan:null, running:false, startAt:0, elapsed:0, raf:0}, wakeLock=null;
function planTotal(p){ return PLANS[p].segs.reduce((a,s)=>a+s[0],0)*60; }
function segAt(p, sec){ let t=0; const segs=PLANS[p].segs; for(let i=0;i<segs.length;i++){ const len=segs[i][0]*60; if(sec<t+len) return {i, lv:segs[i][1], left:t+len-sec, next:segs[i+1]}; t+=len; } return null; }
const fmt = s => { s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
function tick(){
  const p=tState.plan; if(!p) return;
  const sec = tState.elapsed + (tState.running ? (Date.now()-tState.startAt)/1000 : 0);
  const total = planTotal(p), seg = segAt(p, sec);
  const big=document.getElementById("tbig"), clk=document.getElementById("tclock"), nx=document.getElementById("tnext");
  if(!big) return;
  if(!seg){ big.textContent="Done"; big.style.color="var(--accent)"; clk.textContent=fmt(0); nx.textContent="Write down your calories on today's tab."; stopTimer(true); return; }
  big.textContent="Level "+seg.lv; big.style.color=COLOR[seg.lv];
  clk.textContent=fmt(seg.left)+" left at this level";
  nx.textContent=(seg.next?"Next: level "+seg.next[1]+" for "+seg.next[0]+" min":"Last stretch")+" · "+fmt(total-sec)+" to go";
  if(tState.running) tState.raf=requestAnimationFrame(tick);
}
async function startTimer(){ if(tState.running) return; tState.running=true; tState.startAt=Date.now(); try{ wakeLock = await navigator.wakeLock?.request("screen"); }catch(e){} tick(); syncTimerBtns(); }
function stopTimer(done){ if(tState.running){ tState.elapsed += (Date.now()-tState.startAt)/1000; } tState.running=false; cancelAnimationFrame(tState.raf); try{ wakeLock?.release(); }catch(e){} wakeLock=null; syncTimerBtns(); }
function resetTimer(){ stopTimer(); tState.elapsed=0; tick(); }
function syncTimerBtns(){ const b=document.getElementById("tgo"); if(b) b.textContent=tState.running?"Pause":(tState.elapsed?"Resume":"Start"); }
function renderStair(){
  const def = PLAN_BY_DAY[todayId()] || "p40";
  if(!tState.plan) tState.plan = def;
  let h = `<div class="dayhead"><div class="kicker">StairMaster · Week 1</div><h2>Fat-burn intervals</h2><p>Mostly level 7–8, with short level 9 pushes (2 min max). Hands off the rails the whole time; if you grab them, drop one level for the rest of that interval.</p>
  <div class="seg">${Object.entries(PLANS).map(([k,p])=>`<button type="button" data-p="${k}" aria-pressed="${tState.plan===k}">${p.h.split(" ")[0]}</button>`).join("")}</div></div>
  <div class="timer"><div class="kicker" style="font:700 13px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">${esc(PLANS[tState.plan].h)} · ${esc(PLANS[tState.plan].when)}</div><div class="big" id="tbig">Level ${PLANS[tState.plan].segs[0][1]}</div><div class="clock" id="tclock"></div><div class="next" id="tnext"></div>
  <div class="ctl"><button class="btn" id="tgo" type="button">Start</button><button class="btn ghost" id="treset" type="button">Reset</button></div></div>
  <section class="block"><h3>Plan</h3><div class="stairs">` + (()=>{let t=0;return PLANS[tState.plan].segs.map(s=>{const a=t;t+=s[0];return `<div class="lvl"><span class="min">min ${a}–${t}</span><span class="lv">${dot(s[1])} ${s[0]} min</span></div>`}).join("")})() + `</div></section>
  <section class="block"><h3>Your levels</h3><div class="list">` + ZONES.map(z=>`<div class="zone"><span class="lv">${dot(z[0])}</span><div><b>${esc(z[1])}</b><div style="color:var(--muted);font-size:14.5px">${esc(z[2])}</div></div></div>`).join("") + `</div></section>`;
  app.innerHTML = h;
  app.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{ resetTimer(); tState.plan=b.dataset.p; renderStair(); }));
  document.getElementById("tgo").addEventListener("click",()=> tState.running?stopTimer():startTimer());
  document.getElementById("treset").addEventListener("click",resetTimer);
  syncTimerBtns(); tick();
}

const W = Object.assign({block:null, rest:null, lastRest:0}, local.get("hy1-timer")||{});

let actx=null, dockRaf=0, wlock=null;
function unlockAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){} }
/* Loud alarm: repeating two-tone pattern. "playback" lets it ring even with the silent switch on. */
function alarm(sec){ try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){} try{ unlockAudio(); const n=Math.round(sec/0.5); for(let i=0;i<n;i++){ const o=actx.createOscillator(), g=actx.createGain(); o.type="square"; o.frequency.value = i%2 ? 988 : 1319; o.connect(g); g.connect(actx.destination); const t=actx.currentTime+i*0.5; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.4); o.start(t); o.stop(t+0.42); } }catch(e){} try{ navigator.vibrate?.([400,150,400,150,400]); }catch(e){} }
async function keepAwake(){ try{ if(!wlock) wlock = await navigator.wakeLock?.request("screen"); }catch(e){} }
/* iPhone Clock timer through a one-time Shortcut called "Workout Timer". The Clock rings over any app. */
let shortcutName = local.get("hy1-shortcut") || "Start Timer";
function phoneTimer(sec){ location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent(shortcutName) + "&input=text&text=" + Math.round(sec); }
function startBlock(name, sec){ unlockAudio(); W.block={name, end:Date.now()+sec*1000, len:sec, warned:false}; W.rest=null; saveW(); keepAwake(); dockTick(); if(alarmMode==="clock") setTimeout(()=>phoneTimer(sec), 150); }
function stopAll(){ W.block=null; W.rest=null; saveW(); try{ wlock?.release(); }catch(e){} wlock=null; dockTick(); }
function startRest(sec){ unlockAudio(); W.rest={end:Date.now()+sec*1000, len:sec, warned:false}; W.lastRest=sec; saveW(); keepAwake(); dockTick(); }
function alarmSetHTML(){ return `<div class="alarmset"><span>Block alarm</span><div class="seg"><button type="button" data-alarm="sound" aria-pressed="${alarmMode==="sound"}">🔔 App sound</button><button type="button" data-alarm="clock" aria-pressed="${alarmMode==="clock"}">⏰ iPhone timer</button></div></div>
  ${alarmMode==="clock"?`<details class="setup"${local.get("hy1-alarm-ok")?"":" open"}><summary>Set up the iPhone timer (one time, 1 min)</summary>
  <p>Your iPhone doesn't let websites set alarms directly, so your Shortcut does it. When you start a block, the app hands the time to it, it starts your Clock timer, and the Clock rings over anything: Crunchyroll, YouTube, a locked screen.</p>
  <div class="field"><label for="scname">Shortcut name</label><input id="scname" autocomplete="off" value="${esc(shortcutName)}"></div>
  <p class="restwhy" style="margin:4px 0 8px">Must match the name in your Shortcuts app exactly, capitals and spaces included.</p>
  <ol><li>Open the <b>Shortcuts</b> app and tap your shortcut to edit it.</li>
  <li>It needs one action: <b>Start Timer</b>.</li>
  <li>In that action, tap the number (it may say 30) → pick <b>Shortcut Input</b> from the list above the keyboard.</li>
  <li>Tap the word <b>minutes</b> → change it to <b>seconds</b>.</li>
  <li>Tap <b>Done</b>, come back here and tap <b>Test</b>. A 10-second timer should start in your Clock app.</li></ol>
  <p><b>If Test fails:</b> "Shortcut not found" = the name above doesn't match. Timer starts at 30 minutes = step 3 is missing. Timer is 10 minutes = step 4 is missing.</p>
  <p>After a block starts, tap <b>◀</b> at the top-left of your screen to jump back here.</p>
  <button class="btn" type="button" id="alarmtest">Test (10 sec)</button> <button class="btn ghost" type="button" id="alarmok">It worked</button></details>`:`<p class="restwhy" style="margin:6px 0 0">Rings while this app is open, even with the silent switch on. To get alerted inside other apps, switch to iPhone timer.</p>`}`; }
function wireAlarmSet(rerender){
  app.querySelectorAll("[data-alarm]").forEach(b=>b.addEventListener("click",()=>{ alarmMode=b.dataset.alarm; local.set("hy1-alarm",alarmMode); unlockAudio(); if(alarmMode==="sound") alarm(1); rerender(); }));
  document.getElementById("alarmtest")?.addEventListener("click",()=>phoneTimer(10));
  document.getElementById("scname")?.addEventListener("input",e=>{ shortcutName=e.target.value.trim()||"Start Timer"; local.set("hy1-shortcut",shortcutName); });
  document.getElementById("alarmok")?.addEventListener("click",()=>{ local.set("hy1-alarm-ok",true); rerender(); });

function dockTick(){
  clearTimeout(dockRaf);
  let el=document.getElementById("dock");
  const now=Date.now();
  if(W.rest && W.rest.end<=now){ if(!W.rest.warned){ W.rest.warned=true; alarm(2); } W.rest=null; saveW(); }
  if(!W.block && !W.rest){ if(el) el.remove(); document.body.classList.remove("docked"); return; }
  if(!el){ el=document.createElement("div"); el.id="dock"; el.className="dock"; el.setAttribute("role","timer"); document.body.appendChild(el); document.body.classList.add("docked");
    el.addEventListener("click",e=>{ const a=e.target.dataset.act; if(!a) return; if(a==="rest") startRest(W.lastRest||60); if(a==="skip"){ W.rest=null; saveW(); dockTick(); } if(a==="stop") stopAll(); }); }
  let main, cls="", label;
  if(W.rest){ main=fmt((W.rest.end-now)/1000); cls="rest"; label="Rest · go at 0"; }
  else { const left=(W.block.end-now)/1000; if(left<=0 && !W.block.warned){ W.block.warned=true; saveW(); alarm(4); } main=left>0?fmt(left):"+"+fmt(-left); cls=left>0?"":"over"; label=left>0?W.block.name:"Time's up · next block"; }
  el.innerHTML=`<div class="in"><div class="l1"><span>${esc(label)}</span><span>${alarmMode==="clock"?"⏰ iPhone timer":"🔔 Sound on"}</span></div><div class="l2"><div class="main ${cls}">${main}</div><div class="ctl">${W.rest?`<button type="button" data-act="skip">Skip</button>`:`<button type="button" data-act="rest">Rest ${fmt(W.lastRest||60)}</button>`}<button type="button" data-act="stop">Done</button></div></div></div>`;
  dockRaf = setTimeout(()=>requestAnimationFrame(dockTick), 250);
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && (W.block||W.rest)){ keepAwake(); dockTick(); } });

/* ---------- Morning StairMaster: did you go before work? ---------- */
const ymd = dt => dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
function weekDates(offset){ const t=new Date(); t.setHours(12,0,0,0); const mon=new Date(t); mon.setDate(t.getDate()-((t.getDay()+6)%7)+offset*7); return Array.from({length:7},(_,i)=>{const x=new Date(mon); x.setDate(mon.getDate()+i); return x;}); }
function amStats(days){
  const vals = Object.values(days); const went = vals.filter(v=>v==="went").length;
  let streak=0; const t=new Date(); t.setHours(12,0,0,0);
  if(days[ymd(t)]!=="went") t.setDate(t.getDate()-1);
  while(days[ymd(t)]==="went"){ streak++; t.setDate(t.getDate()-1); }
  const wk = weekDates(0).filter(x=>days[ymd(x)]==="went").length;
  return {went, streak, wk};
}
let amWeek = 0;
function renderAM(){
  const d = docOf("am"); d.days = d.days || {};
  const st = amStats(d.days), today = ymd(new Date()), dates = weekDates(amWeek);
  const label = amWeek===0 ? "This week" : amWeek===-1 ? "Last week" : dates[0].toLocaleDateString(undefined,{month:"short",day:"numeric"})+" week";
  let h = `<div class="dayhead"><div class="kicker">Morning StairMaster</div><h2>Before work?</h2><p>Tap Went or Skipped each day. Any morning session counts; the evening plan stays the same.</p>
  <div class="stats"><div class="stat"><b>${st.wk}</b><span>This week</span></div><div class="stat"><b>${st.streak}</b><span>Day streak</span></div><div class="stat"><b>${st.went}</b><span>All time</span></div></div></div>
  <section class="block"><h3>${esc(label)} <small>${dates.filter(x=>d.days[ymd(x)]==="went").length} went · ${dates.filter(x=>d.days[ymd(x)]==="skip").length} skipped</small></h3><div class="list">` +
  dates.map(x=>{ const k=ymd(x), v=d.days[k]||""; return `<div class="amrow${k===today?" today":""}"><div class="d"><b>${x.toLocaleDateString(undefined,{weekday:"short"})}</b><span>${x.toLocaleDateString(undefined,{month:"short",day:"numeric"})}${k===today?" · today":""}</span></div><div class="yn"><button type="button" data-day="${k}" data-v="went" aria-pressed="${v==="went"}">Went</button><button type="button" data-day="${k}" data-v="skip" aria-pressed="${v==="skip"}">Skipped</button></div></div>`; }).join("") +
  `</div><div class="seg"><button type="button" id="am-prev">← Earlier</button><button type="button" id="am-next"${amWeek>=0?" disabled":""}>Later →</button></div></section>`;
  app.innerHTML = h;
  app.querySelectorAll("[data-day]").forEach(b=>b.addEventListener("click",()=>{ const k=b.dataset.day; d.days[k] = d.days[k]===b.dataset.v ? undefined : b.dataset.v; if(!d.days[k]) delete d.days[k]; save("am"); renderAM(); }));
  document.getElementById("am-prev").addEventListener("click",()=>{ amWeek--; renderAM(); });
  document.getElementById("am-next").addEventListener("click",()=>{ if(amWeek<0){ amWeek++; renderAM(); } });
}

/* ---------- Week 1 summary to bring back for Week 2 ---------- */
function summaryText(){
  let out = "DISCIPLINE & CONSISTENCY · WEEK 1 LOG\n";
  DAYS.forEach(day=>{
    const d = docOf(day.id); const lines=[];
    const K=keysFor(day.blocks); day.blocks.forEach((b,bi)=>b.rows.forEach((r,ri)=>{ const v=(d.logs||{})[K[bi][ri]]; if(v&&v.trim()) lines.push(`  ${r[0]}: ${v.trim()} (plan ${r[1]})`); }));
    const total = day.blocks.reduce((a,b)=>a+b.rows.length,0), valid=new Set(K.flat()), n=Object.entries(d.checks||{}).filter(([k,v])=>v&&valid.has(k)).length;
    const missed = n ? day.blocks.flatMap((b,bi)=>b.rows.filter((r,ri)=>!(d.checks||{})[K[bi][ri]]).map(r=>r[0])) : [];
    out += `\n${day.kicker}: ${day.title}\n  Checked off ${n}/${total}\n` + (lines.join("\n")||"  (no numbers logged)") + (missed.length?`\n  Not done: ${missed.join(", ")}`:"") + (d.cal?`\n  StairMaster calories: ${d.cal}`:"") + "\n";
  });
  const g = docOf("checks").gaps; if(g) out += `\nHip check (Sunday): ${g}\n`;
  out += `\nHip mobility nights done: ` + ["mon","tue","wed","thu","fri","sat","sun"].map(w=>{const d=docOf("night-"+w);const n=Object.values(d.checks||{}).filter(Boolean).length+(d.legacyNight||0);return w+" "+n+"/"+NIGHT[NIGHT_BY_DAY[w]].rows.length+(PUSH_BY_DAY[w]?(d.push?" +100":" (no push-ups)"):"")}).join(", ") + "\n";
  const am = docOf("am").days || {}; const wk = weekDates(0);
  out += `\nMorning StairMaster this week: ` + wk.map(x=>x.toLocaleDateString(undefined,{weekday:"short"})+" "+(am[ymd(x)]==="went"?"went":am[ymd(x)]==="skip"?"skipped":"-")).join(", ") + "\n";
  const cd = docOf("cali"); out += `\nCALISTHENICS\n` + SKILLS.map(sk=>{ const nx=sk.steps.findIndex((_,i)=>!skDone(cd,sk,i)); return `  ${sk.name}: ${sk.steps.filter((_,i)=>skDone(cd,sk,i)).length}/${sk.steps.length}` + (nx>=0?` · next: ${sk.steps[nx][0]}`:" · DONE") + ((cd.best||{})[sk.id]?` · best: ${cd.best[sk.id]}`:""); }).join("\n") + "\n";
  const ideas = docOf("ideas").items || [];
  if(ideas.length) out += `\nIDEAS TO ADD (my feedback)\n` + ideas.map(i=>`  - [${i.where}] ${i.what}${i.swap?` (replace: ${i.swap})`:""}${i.link?` ${i.link}`:""}`).join("\n") + "\n";
  return out;
}

  if(day) renderDay(day); else if(id==="stair") renderStair(); else if(id==="night") renderNight(); else if(id==="am") renderAM(); else if(id==="cali") renderCali(); else if(id==="ideas") renderIdeas(); else renderLog();
  app.querySelectorAll("[data-go]").forEach(a=>a.addEventListener("click",e=>{ e.preventDefault(); go(a.dataset.go); }));
}
function go(id){ render(id); window.scrollTo({top:0}); const el=tabsEl.querySelector(`[data-id="${id}"]`); el?.scrollIntoView({inline:"center",block:"nearest"}); }
TABS.forEach(t=>{ const b=document.createElement("button"); b.className="chip"; b.type="button"; b.setAttribute("role","tab"); b.dataset.id=t.id; b.textContent=t.chip; b.addEventListener("click",()=>go(t.id)); tabsEl.appendChild(b); });
let start = todayId(); try{ const h=location.hash.replace("#",""); if(TABS.some(t=>t.id===h)) start=h; }catch(e){}
go(start);
dockTick();

/* ---------- light up account sync when available ---------- */
(async()=>{
  try{
    db = await window.claude?.use?.("db");
    if(!db){ setSync("Saved on this phone"); return; }
    setSync("Syncing…");
    db.collection("week1").onSnapshot(snap=>{
      let changed=false;
      snap.docs.forEach(ds=>{ if(ds.metadata.hasPendingWrites || writing[ds.id] || pending[ds.id]) return; const body=ds.data(); if(body){ cache[ds.id]=migrate(ds.id, JSON.parse(JSON.stringify(body))); local.set("hy1-"+ds.id, cache[ds.id]); changed=true; } });
      setSync("Synced to your account");
      const typing = document.activeElement && document.activeElement.matches("input[data-log], #cal, #gaps, #i-what, #i-link, #i-why, #i-where, [data-best]");
      if(changed && !typing && !tState.running) render(current);
    }, ()=>setSync("Saved on this phone"));
  }catch(e){ setSync("Saved on this phone"); }
})();
</script>
