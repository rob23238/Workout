<header class="top">
  <p class="quote">"The will must be stronger than the skill."<cite>Muhammad Ali</cite></p>
  <div class="brand"><h1>Discipline &amp; Consistency</h1><span>Day by day · Big RPJ</span></div>
</header>

<script>
const APP_VERSION = "2026-10-17c";
const S = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
const AD = "Functional Training", AH = "Functional Training · Hips", AC = "Functional Training · Core", FMF = "Flow Motion Fitness", HAM = "Hampton football", LW = "LW Calisthenics", MINE = "Your routine", WD = "Your hip Word doc";
const PULL_GUIDE = `
<h4>The big idea</h4>
<p>Think of <b>pulling a garage door down</b>. You don't curl it with your biceps. You grab the handle and pull it down with your whole back, elbows driving down to your sides. A pull-up is the same move. The only difference is that the bar doesn't move, so <b>you</b> go up.</p>
<div class="big">Don't pull yourself up. Pull the bar down to your chest.</div>
<h4>Set up (before rep 1)</h4>
<ol>
<li><b>Grab it like a handle you're crushing.</b> Hands a little wider than your shoulders, thumbs around the bar, squeeze hard.</li>
<li><b>Lock your body like a plank.</b> Legs together, squeeze your butt, abs tight. Swinging is like a flag in the wind: power leaks out.</li>
<li><b>Hang with straight arms.</b> Feel the stretch under your armpits. That's your back muscle, ready to pull.</li>
</ol>
<h4>Every rep: 3 moves</h4>
<ol>
<li><b>Shoulders down (arms still straight).</b> Like climbing <b>out of a pool</b>: you press down on the edge and your shoulders drop away from your ears. Do that on the bar. You rise about an inch. This is the move that turns on your back. Skip it and your arms do the work.</li>
<li><b>Pull the garage door down.</b> Now bend your arms. Drive your elbows down to your sides, toward your back pockets. Elbows go <b>down</b>, not forward. If your elbows come forward, it turns into a bicep curl.</li>
<li><b>Chest to the bar.</b> Chest up proud, like you're showing off a jersey number. Chin clears the bar, hold 1 second. Keep your shoulders down, not shrugged up to your ears.</li>
</ol>
<h4>Coming down</h4>
<p><b>Take 3 seconds</b>, like lowering a heavy box onto a table instead of dropping it. Go all the way to straight arms, then start the next rep at move 1 again. No bouncing.</p>
<h4>Where you should feel it</h4>
<p>Under your armpits and the middle of your back. Your arms work too, but they shouldn't be what burns first.</p>
<div class="bad"><b>End the set when:</b> your shoulders shrug to your ears, you swing or kick, your biceps burn before your back, or you can't get back to straight arms. That rep doesn't count.</div>
<h4>Why this breaks the plateau</h4>
<ul>
<li><b>Vest sets:</b> like practicing in heavy boots, then switching to sneakers. Body weight starts to feel light.</li>

function exRest(b, r){
  const base = REST_RULES.find(x=>x[0].test(b.h))[1];
  if(base===0) return 0;
  const m = String(r[2]||"").match(/rest (\d+) sec/i); if(m) return +m[1];
  if(/functional/i.test(b.h)) return 30;
  if(/hip strength/i.test(b.h)) return 30;
  const n = r[0];
  if(/jump|bound|hop/i.test(n)) return 60;
  if(/bench press|back squat|zercher|weighted pull|^set \d|hip thrust|slow pull/i.test(n)) return 120;
  if(/pull-up|dip|pike|handstand|muscle/i.test(n)) return 90;
  if(/leg raise|crunch|dragon|v-ups|jack knife|hollow|pallof|stir|wipers|knee tuck|6-inch|copenhagen|candlestick|plank/i.test(n)) return 45;
  return 60;
}

  return b.rows.map((r,i)=>{
    const t=r[5];
    if(!t) return {sec:exRest(b,r)};
    const idx=groups[t[0]], last=idx.reduce((a,j)=>(+b.rows[j][5].slice(1)>=+b.rows[a][5].slice(1)?j:a), idx[0]);
    if(b.rows[i][5]!==b.rows[last][5]) return {sec:0, next:t[0]+(+t.slice(1)+1)};
    return {sec:Math.max(...idx.map(j=>exRest(b,b.rows[j])))};

}

function migrate(id, d){
  if(!d) return d;
  ["checks","logs"].forEach(f=>{ const o=d[f]; if(!o) return; Object.keys(o).forEach(k=>{ const base=k.replace(/-\d+$/,""), tail=k.slice(base.length); if(RENAMED[base] && !((RENAMED[base]+tail) in o)){ o[RENAMED[base]+tail]=o[k]; delete o[k]; } }); });
  const m = OLD_KEYS[id];
  ["checks","logs"].forEach(f=>{ const o=d[f]; if(!o) return; Object.keys(o).forEach(k=>{
    if(/^\d+-\d+$/.test(k)){ if(m && m[k] && !(m[k] in o)) o[m[k]]=o[k]; delete o[k]; }
    else if(/^[ab]\d$/.test(k)){ if(o[k]) d.legacyNight=(d.legacyNight||0)+1; delete o[k]; }
  }); });
  return d;
}

let tState = Object.assign({plan:null, running:false, startAt:0, elapsed:0, raf:0, lastSeg:-1, alarms:false}, local.get("hy1-stair")||{}), wakeLock=null;
const saveStair = () => local.set("hy1-stair", {plan:tState.plan, running:tState.running, startAt:tState.startAt, elapsed:tState.elapsed, lastSeg:tState.lastSeg, alarms:tState.alarms});
let stairShortcut = (local.get("hy1-stair-shortcut")||"").replace(/^Stair Alarms$/,"") || "Stair Timer";
function planTotal(p){ return PLANS[p].segs.reduce((a,s)=>a+s[0],0)*60; }
function segAt(p, sec){ let t=0; const segs=PLANS[p].segs; for(let i=0;i<segs.length;i++){ const len=segs[i][0]*60; if(sec<t+len) return {i, lv:segs[i][1], left:t+len-sec, next:segs[i+1]}; t+=len; } return null; }
const fmt = s => { s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
/* Level changes only (back-to-back segments at the same level are merged). [minute from start, level] */
function levelChanges(p){ const out=[]; let t=0, prev=null; PLANS[p].segs.forEach(([m,l])=>{ if(l!==prev) out.push([t,l]); prev=l; t+=m; }); return {changes:out, total:t}; }
const clock = d => d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
function tick(){
  const p=tState.plan; if(!p) return;
  const sec = tState.elapsed + (tState.running ? (Date.now()-tState.startAt)/1000 : 0);
  const big=document.getElementById("tbig"), clk=document.getElementById("tclock"), nx=document.getElementById("tnext");
  if(sec<0){ if(big){ big.textContent="Get ready"; big.style.color="var(--muted)"; clk.textContent="Starts in "+fmt(-sec); nx.textContent="First: level "+PLANS[p].segs[0][1]+" for "+PLANS[p].segs[0][0]+" min"+(tState.alarms?" · iPhone alerts set":""); } if(tState.running) tState.raf=setTimeout(()=>requestAnimationFrame(tick),250); return; }
  const total = planTotal(p), seg = segAt(p, sec);
  if(tState.running && seg && seg.i!==tState.lastSeg){ if(tState.lastSeg!==-1 || sec<3) alarm(1); tState.lastSeg=seg.i; saveStair(); }
  if(!seg){ if(tState.running){ alarm(3); stopTimer(true); } if(big){ big.textContent="Done"; big.style.color="var(--accent)"; clk.textContent=fmt(0); nx.textContent="Write down your calories on today's tab."; } return; }
  if(big){ big.textContent="Level "+seg.lv; big.style.color=COLOR[seg.lv]; clk.textContent=fmt(seg.left)+" left at this level"; nx.textContent=(seg.next?"Next: level "+seg.next[1]+" for "+seg.next[0]+" min":"Last stretch")+" · "+fmt(total-sec)+" to go"; }
  if(tState.running) tState.raf=setTimeout(()=>requestAnimationFrame(tick),250);
}
async function startTimer(){ if(tState.running) return; unlockAudio(); tState.running=true; tState.startAt=Date.now(); tState.alarms=false; if(!tState.elapsed) tState.lastSeg=-1; saveStair(); try{ wakeLock = await navigator.wakeLock?.request("screen"); }catch(e){} tick(); syncTimerBtns(); }
function stopTimer(done){ if(tState.running){ tState.elapsed += Math.max(0,(Date.now()-tState.startAt)/1000); } tState.running=false; clearTimeout(tState.raf); try{ wakeLock?.release(); }catch(e){} wakeLock=null; saveStair(); syncTimerBtns(); }
function resetTimer(){ stopTimer(); tState.elapsed=0; tState.lastSeg=-1; tState.alarms=false; saveStair(); tick(); }
function syncTimerBtns(){ const b=document.getElementById("tgo"); if(b) b.textContent=tState.running?"Pause":(tState.elapsed?"Resume":"Start"); }
/* One tap: start at the next full minute and send every level change to the iPhone as Clock alarms. */
async function startWithAlarms(){
  unlockAudio(); resetTimer();
  const p=tState.plan, now=new Date(), start=new Date(now); start.setSeconds(0,0); start.setMinutes(start.getMinutes()+1);
  if(start-now < 25000) start.setMinutes(start.getMinutes()+1);
  const {changes,total}=levelChanges(p);
  const lines = changes.map(([m,l],i)=>`${clock(new Date(+start+m*60000))} · ${i===0?"Start · ":""}Level ${l}`);
  lines.push(`${clock(new Date(+start+total*60000))} · StairMaster done`);
  tState.running=true; tState.startAt=+start; tState.elapsed=0; tState.lastSeg=-1; tState.alarms=true; saveStair();
  try{ wakeLock = await navigator.wakeLock?.request("screen"); }catch(e){}
  renderStair();
  setTimeout(()=>{ location.href="shortcuts://run-shortcut?name="+encodeURIComponent(stairShortcut)+"&input=text&text="+encodeURIComponent(lines.join("\n")); },200);
}
function renderStair(){
  const def = PLAN_BY_DAY[todayId()] || "p40";
  if(!tState.plan) tState.plan = def;
  const lc = levelChanges(tState.plan);
  let h = `<div class="dayhead"><div class="kicker">StairMaster · Week 1</div><h2>${esc(PLANS[tState.plan].h)}</h2><p>${esc(PLANS[tState.plan].desc)}</p><p style="margin-top:6px">Hands off the rails the whole time; if you grab them, drop one level for the rest of that interval.</p>
  <div class="seg">${Object.entries(PLANS).map(([k,p])=>`<button type="button" data-p="${k}" aria-pressed="${tState.plan===k}">${p.h.split(" ")[0]}</button>`).join("")}</div></div>
  <div class="timer"><div class="kicker" style="font:700 13px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">${esc(PLANS[tState.plan].h)} · ${esc(PLANS[tState.plan].when)}</div><div class="big" id="tbig">Level ${PLANS[tState.plan].segs[0][1]}</div><div class="clock" id="tclock"></div><div class="next" id="tnext"></div>
  <div class="ctl"><button class="btn" id="tgo" type="button">Start</button><button class="btn ghost" id="treset" type="button">Reset</button></div>
  <p class="restwhy" style="margin:8px 0 0">The tone plays at each level change while this app is open.</p></div>${NOSE_CARDIO}
  <section class="block"><h3>Plan</h3><div class="stairs">` + (()=>{let t=0;return PLANS[tState.plan].segs.map(s=>{const a=t;t+=s[0];return `<div class="lvl"><span class="min">min ${a}–${t}</span><span class="lv">${dot(s[1])} ${s[0]} min</span></div>`}).join("")})() + `</div></section>
  <section class="block"><h3>Your levels</h3><div class="list">` + ZONES.map(z=>`<div class="zone"><span class="lv">${dot(z[0])}</span><div><b>${esc(z[1])}</b><div style="color:var(--muted);font-size:14.5px">${esc(z[2])}</div></div></div>`).join("") + `</div></section>`;
  app.innerHTML = h;
  app.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>{ resetTimer(); tState.plan=b.dataset.p; saveStair(); renderStair(); }));
  document.getElementById("tgo").addEventListener("click",()=>{ if(tState.running) stopTimer(); else startTimer(); });
  document.getElementById("treset").addEventListener("click",resetTimer);
  syncTimerBtns(); clearTimeout(tState.raf); tick();

/* ---------- Workout timer dock: total time, current block, rest ---------- */
const W = Object.assign({block:null, rest:null, lastRest:0}, local.get("hy1-timer")||{});
delete W.start; delete W.target; delete W.day;
const saveW = () => local.set("hy1-timer", W);
let actx=null, dockRaf=0, wlock=null;
function unlockAudio(){ try{
  try{ if(navigator.audioSession) navigator.audioSession.type="ambient"; }catch(e){}
  if(actx && actx.state==="closed") actx=null;
  actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state!=="running"){ const p=actx.resume(); if(p&&p.catch) p.catch(()=>{}); }
  const s=actx.createBufferSource(); s.buffer=actx.createBuffer(1,1,22050); s.connect(actx.destination); s.start(0);
}catch(e){} }
/* iPhone pauses web sound after a lock, call or music: wake it on the next tap */
["touchstart","pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,()=>{ if(actx && actx.state!=="running") unlockAudio(); },{passive:true,capture:true}));
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && actx && actx.state!=="running") unlockAudio(); });
/* Alarm: short, deep, upbeat two-note "let's go" tone (low root up to the fifth, then the octave).
   "ambient" mixes with YouTube/music instead of pausing it. */
function alarm(sec){
  try{ if(navigator.audioSession) navigator.audioSession.type="ambient"; }catch(e){}
  try{
    unlockAudio();
    const notes=[[196.00,0],[293.66,0.11],[392.00,0.22]], reps=Math.max(1,Math.round(sec/1.3)), t0=actx.currentTime+0.05;
    const out=actx.createGain(); out.gain.value=0.55; out.connect(actx.destination);
    const lp=actx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2400; lp.connect(out);
    for(let r=0;r<reps;r++) notes.forEach(([f,dt],i)=>{
      const t=t0+r*1.3+dt, len=i===2?0.7:0.22;
      [["triangle",1,0.30],["sine",0.5,0.18],["sine",2,0.05]].forEach(([type,mult,vol])=>{ // body + low weight + a little shine
        const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.value=f*mult;
        o.connect(g); g.connect(lp);
        g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+len);
        o.start(t); o.stop(t+len+0.05);
      });
    });
  }catch(e){}
  try{ navigator.vibrate?.([120,80,120]); }catch(e){}
}
async function keepAwake(){ try{ if(!wlock) wlock = await navigator.wakeLock?.request("screen"); }catch(e){} }
/* iPhone Clock timer through your Shortcut (default name "Start Timer"). The Clock rings over any app. */
let shortcutName = local.get("hy1-shortcut") || "Start Timer";
function phoneTimer(sec){ location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent(shortcutName) + "&input=text&text=" + Math.round(sec); }
function startBlock(name, sec, ios){ unlockAudio(); W.block={name, end:Date.now()+sec*1000, len:sec, warned:false}; W.rest=null; saveW(); keepAwake(); dockTick(); if(ios) setTimeout(()=>phoneTimer(sec), 150); }
function stopAll(){ W.block=null; W.rest=null; W.finish=0; W.dayId=null; saveW(); try{ wlock?.release(); }catch(e){} wlock=null; dockTick(); }
function startRest(sec, ios){ unlockAudio(); W.rest={end:Date.now()+sec*1000, len:sec, warned:false}; W.lastRest=sec; saveW(); keepAwake(); dockTick(); if(ios) setTimeout(()=>phoneTimer(sec), 150); }
let finishShortcut = local.get("hy1-finish-shortcut") || "Stair Timer";
function startWorkout(day, ios){ unlockAudio(); W.finish=Date.now()+mins(day.time)*60000; W.dayId=day.id; W.finishWarned=false; saveW(); keepAwake(); dockTick();
  if(ios) setTimeout(()=>{ location.href="shortcuts://run-shortcut?name="+encodeURIComponent(finishShortcut)+"&input=text&text="+encodeURIComponent(`${clock(new Date(W.finish))} · ${day.chip} workout done`); },150); }
/* Two buttons per timer: 🔔 runs in the app, ⏰ also starts your iPhone Clock timer through the Start Timer shortcut. */
function tpair(kind, sec, label, name){ const n=name?` data-name="${esc(name)}"`:""; return `<span class="tpair"><button class="tbtn${kind==="rest"?" rest":""}" type="button" data-t="${kind}" data-sec="${sec}"${n} aria-label="${esc(label)} in app">🔔 ${esc(label)}</button><button class="tbtn ios" type="button" data-t="${kind}" data-sec="${sec}"${n} data-ios="1" aria-label="${esc(label)}: iPhone timer only">⏰</button></span>`; }
function wireTimers(){ app.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>{ const sec=+b.dataset.sec; if(b.dataset.ios){ phoneTimer(sec); return; } if(b.dataset.t==="rest") startRest(sec, false); else startBlock(b.dataset.name||"Block", sec, false); })); }
function dockTick(){
  clearTimeout(dockRaf);
  let el=document.getElementById("dock");
  const now=Date.now();
  if(W.rest && W.rest.end<=now){ if(!W.rest.warned){ W.rest.warned=true; alarm(2); } W.rest=null; saveW(); }
  if(W.finish && W.finish<=now && !W.finishWarned){ W.finishWarned=true; saveW(); alarm(4); }
  if(!W.block && !W.rest && !W.finish){ if(el) el.remove(); document.body.classList.remove("docked"); return; }
  if(!el){ el=document.createElement("div"); el.id="dock"; el.className="dock"; el.setAttribute("role","timer"); document.body.appendChild(el); document.body.classList.add("docked");
    el.addEventListener("click",e=>{ const a=e.target.dataset.act; if(!a) return; if(a==="rest") startRest(W.lastRest||60, false); if(a==="skip"){ W.rest=null; saveW(); dockTick(); } if(a==="stop"){ if(!W.finish || confirm("End this workout?")){ stopAll(); if(DAYS.some(d=>d.id===current)) render(current); } } }); }
  let main, cls="", label;
  const fin = W.finish ? (W.finish>now ? `Finish by ${clock(new Date(W.finish))} · ${fmt((W.finish-now)/1000)} left` : `Past finish time · +${fmt((now-W.finish)/1000)}`) : "";
  if(W.rest){ main=fmt((W.rest.end-now)/1000); cls="rest"; label="Rest · go at 0"; }
  else if(W.block){ const left=(W.block.end-now)/1000; if(left<=0 && !W.block.warned){ W.block.warned=true; saveW(); alarm(4); } main=left>0?fmt(left):"+"+fmt(-left); cls=left>0?"":"over"; label=left>0?W.block.name:"Time's up"; }
  else { const left=(W.finish-now)/1000; main=left>0?fmt(left):"+"+fmt(-left); cls=left>0?"":"over"; label="Workout time left"; }
  el.innerHTML=`<div class="in"><div class="l1"><span>${esc(label)}</span><span>${esc(fin)}</span></div><div class="l2"><div class="main ${cls}">${main}</div><div class="ctl">${W.rest?`<button type="button" data-act="skip">Skip</button>`:`<button type="button" data-act="rest">Rest ${fmt(W.lastRest||60)}</button>`}<button type="button" data-act="stop">${W.finish?"End":"Done"}</button></div></div></div>`;
  dockRaf = setTimeout(()=>requestAnimationFrame(dockTick), 250);
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && (W.block||W.rest||W.finish)){ keepAwake(); dockTick(); } });

const ymd = dt => dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
function weekDates(offset){ const t=new Date(); t.setHours(12,0,0,0); const mon=new Date(t); mon.setDate(t.getDate()-((t.getDay()+6)%7)+offset*7); return Array.from({length:7},(_,i)=>{const x=new Date(mon); x.setDate(mon.getDate()+i); return x;}); }

async function checkUpdate(){

    const m = (await r.text()).match(/APP_VERSION = "([^"]+)"/);
    if(m && m[1] !== APP_VERSION && !W.block && !W.rest){
      /* Load the new version by a fresh address so no saved copy gets in the way; only try once per version. */
      let tried=null; try{ tried=sessionStorage.getItem("hy1-upd"); }catch(e){}
      if(tried===m[1]) return;
      try{ sessionStorage.setItem("hy1-upd", m[1]); }catch(e){}
      location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]) + location.hash);
    }
  }catch(e){}
}

    db.collection("week1").onSnapshot(snap=>{
      let changed=false;
      snap.docs.forEach(ds=>{ if(ds.metadata.hasPendingWrites || writing[ds.id] || pending[ds.id]) return; const body=ds.data(); if(body){ cache[ds.id]=migrate(ds.id, JSON.parse(JSON.stringify(body))); local.set("hy1-"+ds.id, cache[ds.id]); changed=true; } });
      setSync("Synced to your account");
      const typing = document.activeElement && document.activeElement.matches("input[data-log], #xname, #cal, #gaps, #i-what, #i-link, #i-why, #i-where, [data-best]");
      if(changed && !typing && !tState.running) render(current);
    }, ()=>setSync("Saved on this phone"));
  }catch(e){ setSync("Saved on this phone"); }
})();
</script>
